version: 2
updates:

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    groups:
      all-github-actions:
        patterns:
          - "*"

  # Maintain dependencies for GO
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    groups:
      security-updates-go-dependencies:
        applies-to: security-updates
        patterns:
          - "*"
      version-updates-go-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
