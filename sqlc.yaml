version: "2"
sql:
  - engine: "sqlite"
    queries: "sqlc/queries"
    schema: "sqlc/migrations"
    database:
      uri: "file:out/database.sqlite"
    rules:
      - sqlc/db-prepare
    gen:
      go:
        package: "db"
        out: "internal/pkg/db"
        emit_db_tags: true
        emit_json_tags: false
        emit_prepared_queries: true
        emit_interface: false
        emit_sql_as_comment: true
        overrides:
          - column: "access_tokens.id"
            go_type: "github.com/google/uuid.UUID"

          - column: "*.scopes"
            go_type: "baconi.co.uk/oauth/internal/pkg/scope.Scopes"
          - column: "*.client_id"
            go_type: "baconi.co.uk/oauth/internal/pkg/client.Id"
          - column: "*.username"
            go_type: "baconi.co.uk/oauth/internal/pkg/user.AuthenticatedUsername"